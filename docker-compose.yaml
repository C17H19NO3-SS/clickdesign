version: '3.8'

services:
  app:
    build: .
    container_name: clickdesign_app
    ports:
      - "8080:80"
    environment:
      - CI_ENVIRONMENT=development
      - app.baseURL=http://localhost:8080/
      - database.default.hostname=db
      - database.default.database=software_store
      - database.default.username=root
      - database.default.password=root_password
      - database.default.DBDriver=MySQLi
    volumes:
      - app_uploads:/var/www/html/writable/uploads
      - app_private_downloads:/var/www/html/writable/private_downloads
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: clickdesign_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: software_store
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: clickdesign_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
  app_uploads:
  app_private_downloads:
